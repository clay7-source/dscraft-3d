name: Build Nintendo DS ROM

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install NDS SDK (libnds)
        run: |
          dkp-pacman -S --needed --noconfirm nds-dev

      - name: Build NDS ROM
        run: |
          make
          ls -lh dscraft3d.nds
          SIZE=$(stat -c%s dscraft3d.nds 2>/dev/null || stat -f%z dscraft3d.nds)
          echo "Built ROM size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "Injecting NitroFS filesystem into ROM..."
            ndstool -c dscraft3d.nds -9 dscraft3d.elf -d nitrofiles
            ls -lh dscraft3d.nds
          fi

      - name: Upload .NDS ROM
        uses: actions/upload-artifact@v4
        with:
          name: dscraft3d-rom
          path: dscraft3d.nds
